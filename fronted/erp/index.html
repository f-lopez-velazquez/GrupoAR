  <!-- Loading styles -->
  <style>
    .app-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0066cc, #0099ff);
      color: white;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .app-loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .app-loading-text {
      margin-top: 16px;
      font-size: 14px;
      opacity: 0.8;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .no-js-warning {
      display: none;
      padding: 20px;
      text-align: center;
      background: #fef2f2;
      color: #b91c1c;
    }

    html.no-js .no-js-warning {
      display: block;
    }

    html.no-js .app-loading {
      display: none;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900 font-sans">
  <!-- No JavaScript Warning -->
  <noscript>
    <div class="no-js-warning">
      <h1>JavaScript Requerido</h1>
      <p>Este sitio requiere JavaScript para funcionar. Por favor habilítalo en tu navegador.</p>
    </div>
  </noscript>

  <!-- App Root -->
  <div id="root">
    <div class="app-loading">
      <div class="app-loading-spinner"></div>
      <p class="app-loading-text">Cargando Grupo AR...</p>
    </div>
  </div>

  <!-- Main App -->
  <script type="module" src="/src/main.jsx"></script>

  <!-- Service Worker Registration -->
  <script>
    // Mark as JavaScript enabled
    document.documentElement.classList.remove('no-js');

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => {
            console.log('[App] Service worker registered:', reg.scope);

            // Handle updates
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // New content available
                  console.log('[App] New content available, refresh for updates');
                }
              });
            });
          })
          .catch((err) => {
            console.error('[App] Service worker registration failed:', err);
          });

        // Listen for messages from service worker
        navigator.serviceWorker.addEventListener('message', (event) => {
          if (event.data?.type === 'SYNC_PENDING') {
            window.dispatchEvent(new CustomEvent('syncPendingOperations'));
          }
        });
      });
    }

    // Install prompt handling
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      window.deferredPrompt = deferredPrompt;
      console.log('[App] Install prompt ready');
    });

    // Detect standalone mode
    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
      console.log('[App] Running in standalone mode');
    }
  </script>
</body>

</html>
