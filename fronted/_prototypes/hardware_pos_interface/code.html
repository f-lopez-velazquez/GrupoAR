<!DOCTYPE html>
<html class="light" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"

    />
      <link rel="stylesheet" href="/assets/tailwind.css" />
  <link rel="stylesheet" href="/assets/theme.css" />
</head>
  <body class="bg-background-light bg-background-dark font-display h-screen flex flex-col overflow-hidden text-slate-900 text-white">
    <header
      class="flex shrink-0 items-center justify-between whitespace-nowrap border-b border-solid border-slate-200 border-slate-800 bg-surface-light bg-surface-dark px-6 py-3 h-16 shadow-sm z-20"
    >
      <div class="flex items-center gap-4">
        <img src="/assets/logo.png" alt="Logo Grupo AR" class="h-9 w-9" />
        <div>
          <h2 class="text-lg font-bold leading-tight tracking-tight">Grupo AR</h2>
          <span class="text-xs text-slate-500 text-slate-400 font-medium">Ferretería • Terminal POS 04</span>
        </div>
      </div>
      <div class="flex items-center gap-6">
        <div class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-600 text-slate-400">
          <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-100 bg-slate-800">
            <span class="material-symbols-outlined text-[20px]">wifi</span>
            <span class="text-emerald-600 text-emerald-400 font-bold">En linea</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-[20px]">schedule</span>
            <span id="clock">--:--</span>
          </div>
        </div>
        <div class="flex gap-3">
          <button id="btnDashboard" class="flex items-center gap-2 cursor-pointer overflow-hidden rounded-lg h-9 px-3 bg-slate-100 hover:bg-slate-200 bg-slate-800 hover:bg-slate-700 transition-colors text-slate-700 text-slate-300 text-sm font-semibold">
            <span class="material-symbols-outlined text-[18px]">dashboard</span>
            <span class="hidden sm:inline">Panel</span>
          </button>
          <button id="btnProfile" class="flex items-center gap-2 cursor-pointer overflow-hidden rounded-lg h-9 px-3 bg-primary hover:bg-blue-600 transition-colors text-white text-sm font-semibold">
            <span class="material-symbols-outlined text-[18px]">account_circle</span>
            <span class="hidden sm:inline" id="profileLabel">Perfil</span>
          </button>
        </div>
      </div>
    </header>

    <div class="flex flex-1 overflow-hidden h-full">
      <main class="flex-1 flex flex-col min-w-0 bg-background-light bg-background-dark p-4 md:p-6 overflow-y-auto">
        <form id="skuForm" class="flex flex-col sm:flex-row gap-4 mb-6">
          <div class="flex-1 relative group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <span class="material-symbols-outlined text-slate-400">qr_code_scanner</span>
            </div>
            <input
              id="skuInput"
              class="w-full pl-12 pr-4 py-4 rounded-xl border border-slate-200 border-slate-700 bg-white bg-surface-dark text-slate-900 text-white placeholder:text-slate-400 placeholder:text-slate-500 focus:ring-2 focus:ring-primary focus:border-transparent text-lg font-medium shadow-sm transition-all"
              placeholder="Escanea o ingresa SKU..."
              type="text"
              autofocus
            />
          </div>
          <div class="sm:w-1/3 relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <span class="material-symbols-outlined text-slate-400">search</span>
            </div>
            <input
              id="nameInput"
              class="w-full pl-12 pr-4 py-4 rounded-xl border border-slate-200 border-slate-700 bg-white bg-surface-dark text-slate-900 text-white placeholder:text-slate-400 placeholder:text-slate-500 focus:ring-2 focus:ring-primary focus:border-transparent text-lg font-medium shadow-sm transition-all"
              placeholder="Buscar producto..."
              type="text"
            />
          </div>
        </form>

        <div class="mb-6 overflow-x-auto pb-1 scrollbar-hide">
          <div id="categoryTabs" class="flex gap-2 min-w-max"></div>
        </div>

        <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 overflow-y-auto pb-20">
          <div class="text-slate-400 text-sm">Cargando inventario...</div>
        </div>
      </main>

      <aside class="w-[420px] max-w-[40%] flex-none flex flex-col bg-surface-light bg-surface-dark border-l border-slate-200 border-slate-800 shadow-xl z-10">
        <div class="p-4 border-b border-slate-200 border-slate-800 bg-slate-50 bg-[#151e28]">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-bold uppercase text-slate-500 text-slate-400 tracking-wider">Cliente</span>
            <button id="btnCustomer" class="text-primary hover:text-blue-400 text-xs font-semibold flex items-center gap-1">
              <span class="material-symbols-outlined text-[16px]">edit</span> Cambiar
            </button>
          </div>
          <div class="flex items-center gap-3">
            <div class="size-10 rounded-full bg-slate-200 bg-slate-700 flex items-center justify-center text-slate-500 text-slate-300">
              <span class="material-symbols-outlined">person</span>
            </div>
            <div>
              <h3 id="customerName" class="text-sm font-bold text-slate-900 text-white">Cliente publico</h3>
              <p id="customerType" class="text-xs text-slate-500 text-slate-400">General (Mostrador)</p>
            </div>
          </div>
        </div>
        <div class="flex-1 overflow-y-auto overflow-x-hidden p-2">
          <table class="w-full border-separate border-spacing-y-2">
            <thead>
              <tr class="text-left text-xs text-slate-500 text-slate-400">
                <th class="px-2 pb-1 font-medium w-[45%]">Articulo</th>
                <th class="px-2 pb-1 font-medium text-center">Cant.</th>
                <th class="px-2 pb-1 font-medium text-right">Precio</th>
                <th class="px-2 pb-1 font-medium text-right">Total</th>
                <th class="w-8"></th>
              </tr>
            </thead>
            <tbody id="cartBody"></tbody>
          </table>
        </div>

        <div class="bg-white bg-surface-dark border-t border-slate-200 border-slate-800 p-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-20">
          <div class="mb-4">
            <p class="text-xs font-bold text-slate-500 text-slate-400 uppercase tracking-wider mb-2">Metodo de pago</p>
            <div class="grid grid-cols-2 gap-2">
              <label class="cursor-pointer relative">
                <input id="paymentCash" checked class="peer sr-only" name="payment" type="radio" />
                <div class="p-2 rounded-lg border border-slate-200 border-slate-700 bg-slate-50 bg-slate-800 peer-checked:bg-primary/10 peer-checked:border-primary peer-checked:text-primary flex items-center justify-center gap-2 transition-all">
                  <span class="material-symbols-outlined">payments</span>
                  <span class="font-semibold text-sm">Efectivo</span>
                </div>
              </label>
              <label class="cursor-pointer relative">
                <input id="paymentCard" class="peer sr-only" name="payment" type="radio" />
                <div class="p-2 rounded-lg border border-slate-200 border-slate-700 bg-slate-50 bg-slate-800 peer-checked:bg-primary/10 peer-checked:border-primary peer-checked:text-primary flex items-center justify-center gap-2 transition-all">
                  <span class="material-symbols-outlined">credit_card</span>
                  <span class="font-semibold text-sm">Tarjeta</span>
                </div>
              </label>
            </div>
          </div>

          <div class="space-y-2 mb-6">
            <div class="flex justify-between text-slate-500 text-slate-400 text-sm">
              <span>Subtotal</span>
              <span id="subtotal" class="font-mono">$0.00</span>
            </div>
            <div class="flex justify-between text-slate-500 text-slate-400 text-sm">
              <span>IVA (16%)</span>
              <span id="tax" class="font-mono">$0.00</span>
            </div>
            <div class="flex justify-between items-end border-t border-slate-200 border-slate-700 pt-2 mt-2">
              <span class="text-lg font-bold text-slate-900 text-white">Total</span>
              <span id="total" class="text-3xl font-black text-primary font-mono tracking-tight">$0.00</span>
            </div>
          </div>

          <button id="btnFinalize" class="w-full bg-primary hover:bg-blue-600 active:bg-blue-700 text-white rounded-xl py-4 flex items-center justify-between px-6 shadow-lg shadow-primary/25 transition-all transform active:scale-[0.99] group">
            <div class="flex flex-col items-start">
              <span class="text-lg font-bold">Finalizar e Imprimir</span>
              <span class="text-xs opacity-80 font-medium">F12</span>
            </div>
            <span class="material-symbols-outlined text-3xl group-hover:translate-x-1 transition-transform">print</span>
          </button>
          <div class="flex justify-center mt-3">
            <button id="btnCancel" class="text-slate-400 hover:text-slate-600 hover:text-slate-300 text-xs font-medium flex items-center gap-1 transition-colors">
              <span class="material-symbols-outlined text-[14px]">cancel</span> Cancelar orden
            </button>
          </div>
          <div id="status" class="mt-3 text-xs text-slate-500"></div>
          <div id="ticketInfo" class="mt-2 text-xs text-slate-400"></div>
        </div>
      </aside>
    </div>

    <div id="loginModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
      <div class="bg-white bg-surface-dark rounded-xl p-6 w-full max-w-sm shadow-xl border border-slate-200 border-slate-700">
        <h3 class="text-lg font-bold mb-4">Ingreso POS</h3>
        <label class="text-sm font-medium flex flex-col gap-2 mb-3">
          Usuario o correo
          <input id="loginEmail" type="text" class="rounded-lg border border-slate-200 border-slate-700 bg-slate-50 bg-slate-900 h-10 px-3" />
        </label>
        <label class="text-sm font-medium flex flex-col gap-2 mb-4">
          Contraseña
          <input id="loginPassword" type="password" class="rounded-lg border border-slate-200 border-slate-700 bg-slate-50 bg-slate-900 h-10 px-3" />
        </label>
        <div class="flex gap-2">
          <button id="btnLogin" class="flex-1 bg-primary text-white rounded-lg py-2 font-bold">Ingresar</button>
          <button id="btnLogout" class="flex-1 bg-slate-100 bg-slate-800 rounded-lg py-2">Salir</button>
        </div>
        <div id="loginStatus" class="mt-3 text-xs text-slate-500"></div>
      </div>
    </div>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
      import {
        getAuth,
        onAuthStateChanged,
        signInWithEmailAndPassword,
        signOut,
      } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
      import {
        collection,
        doc,
        getDoc,
        getFirestore,
        limit,
        onSnapshot,
        orderBy,
        query,
        runTransaction,
        serverTimestamp,
      } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
      import { logAuditEvent } from '/shared/audit.js';

      const firebaseConfig = {
        apiKey: "AIzaSyCSmb_4bBzLTovhm-aKXYkjgT_oRFum_pA",
        authDomain: "gpo-ar.firebaseapp.com",
        projectId: "gpo-ar",
        storageBucket: "gpo-ar.firebasestorage.app",
        messagingSenderId: "826066778675",
        appId: "1:826066778675:web:9413dcaca733d45db04146",
        measurementId: "G-0BNP5PLDH2",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      const inventory = [];
      let cart = [];
      let activeCategory = "Todas";
      let paymentMethod = "cash";
      let currentUser = null;
      let hasPosAccess = false;
      let currentProfile = null;
      let customer = { name: "Cliente público", type: "General (Mostrador)" };

      const productGrid = document.getElementById("productGrid");
      const cartBody = document.getElementById("cartBody");
      const statusEl = document.getElementById("status");
      const ticketInfo = document.getElementById("ticketInfo");
      const subtotalEl = document.getElementById("subtotal");
      const taxEl = document.getElementById("tax");
      const totalEl = document.getElementById("total");
      const skuInput = document.getElementById("skuInput");
      const nameInput = document.getElementById("nameInput");
      const customerName = document.getElementById("customerName");
      const customerType = document.getElementById("customerType");

      const formatMoney = (value) =>
        Number(value || 0).toLocaleString("es-MX", {
          style: "currency",
          currency: "MXN",
        });

            const escapeXml = (value) =>
        String(value ? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");

      const createPlaceholderDataUri = (title, subtitle) => {
        const safeTitle = escapeXml(String(title || "Producto").slice(0, 30));
        const safeSubtitle = escapeXml(String(subtitle || "Ferretería").slice(0, 34));
        const svg = `
          <svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
            <rect width="640" height="480" fill="#ffffff" />
            <rect x="20" y="20" width="600" height="440" rx="28" fill="#f1f5f9" stroke="#e2e8f0" />
            <circle cx="320" cy="190" r="64" fill="#0ea5e9" opacity="0.18" />
            <rect x="266" y="136" width="108" height="108" rx="24" fill="#0ea5e9" opacity="0.22" />
            <text x="320" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#0f172a">${safeTitle}</text>
            <text x="320" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#64748b">${safeSubtitle}</text>
          </svg>`;
        return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
      };
      const normalizeCategory = (value) =>
        String(value || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .trim();

      const resolveImageUrl = (item) => {
        const categoryFallbacks = {
          tornilleria: "stock/tornilleria",
          electrico: "stock/electrico",
          plomeria: "stock/plomeria",
          albanileria: "stock/albanileria",
        };
        const raw = item.imageUrl || item.image || item.imageId;
        if (!raw) {
          const fallback = categoryFallbacks[normalizeCategory(item.category)];
          return fallback ? `https://res.cloudinary.com/dyzin1srr/image/upload/${fallback}` : null;
        }
        if (String(raw).startsWith("http")) return raw;
        return `https://res.cloudinary.com/dyzin1srr/image/upload/${raw}`;
      };

      const setStatus = (message) => {
        statusEl.textContent = message || "";
      };

      const DEFAULT_LOGIN_DOMAIN = "grupoar.com";
      const normalizeLogin = (value) => {
        const trimmed = String(value || "").trim();
        if (!trimmed) return "";
        if (trimmed.includes("@")) return trimmed;
        return `${trimmed}@${DEFAULT_LOGIN_DOMAIN}`;
      };

      const setClock = () => {
        const now = new Date();
        document.getElementById("clock").textContent = now.toLocaleTimeString("es-MX", {
          hour: "2-digit",
          minute: "2-digit",
        });
      };
      setClock();
      setInterval(setClock, 60000);

      const renderCategories = () => {
        const tabContainer = document.getElementById("categoryTabs");
        const categories = Array.from(new Set(inventory.map((item) => item.category).filter(Boolean))).sort((a, b) =>
          String(a).localeCompare(String(b))
        );
        const allCategories = ["Todas", ...categories];
        tabContainer.innerHTML = allCategories
          .map((category, index) => {
            const isActive = category === activeCategory || (index === 0 && activeCategory === "Todas");
            const activeClasses = isActive
              ? "bg-primary text-white shadow-primary/20"
              : "bg-white bg-surface-dark text-slate-600 text-slate-400 border border-slate-200 border-slate-700 hover:bg-slate-100 hover:bg-slate-700";
            const icon = index === 0 ? "grid_view" : "inventory_2";
            return `
              <button data-category="${category}" class="px-5 py-2.5 rounded-full font-medium text-sm transition-colors flex items-center gap-2 ${activeClasses}">
                <span class="material-symbols-outlined text-[18px]">${icon}</span>
                ${category}
              </button>
            `;
          })
          .join("");
      };

      const renderProducts = () => {
        const term = nameInput.value.toLowerCase();
        const filtered = inventory.filter((item) => {
          const matchesCategory = activeCategory === "Todas" || item.category === activeCategory;
          const matchesName = !term || item.name?.toLowerCase().includes(term);
          return matchesCategory && matchesName;
        });

        if (filtered.length === 0) {
          productGrid.innerHTML = '<div class="text-slate-400 text-sm">Sin productos.</div>';
          return;
        }

        productGrid.innerHTML = filtered
          .map((item) => {
            const unit = item.unit ? `<div class="absolute top-2 right-2 bg-black/60 backdrop-blur-sm text-white text-xs font-bold px-2 py-1 rounded">${item.unit}</div>` : "";
                        const imageUrl = resolveImageUrl(item) || createPlaceholderDataUri(item.name || "Producto", item.category || "Ferretería");
                        const image = `<div class="w-full h-full bg-center bg-cover transform group-hover:scale-105 transition-transform duration-500" style="background-image: url(\"${imageUrl}\")"></div>`;\n            return `
              <button class="group flex flex-col bg-white bg-surface-dark rounded-xl overflow-hidden border border-slate-200 border-slate-700 hover:border-primary/50 hover:border-primary/50 shadow-sm hover:shadow-md hover:shadow-primary/10 transition-all text-left relative" data-id="${item.id}">
                <div class="aspect-[4/3] w-full bg-slate-100 bg-slate-800 relative overflow-hidden">
                  ${image}
                  ${unit}
                </div>
                <div class="p-4 flex flex-col flex-1 justify-between">
                  <div class="mb-2">
                    <h3 class="text-sm font-semibold text-slate-900 text-white line-clamp-2 leading-snug">${item.name || "Producto"}</h3>
                    <p class="text-xs text-slate-500 mt-1">SKU: ${item.sku || "-"}</p>
                  </div>
                  <div class="flex items-center justify-between">
                    <span class="text-primary font-bold text-lg font-mono">${formatMoney(item.price)}</span>
                    <div class="size-8 rounded-full bg-slate-100 bg-slate-700 text-primary flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                      <span class="material-symbols-outlined text-sm">add</span>
                    </div>
                  </div>
                </div>
              </button>
            `;
          })
          .join("");
      };

      const renderCart = () => {
        if (cart.length === 0) {
          cartBody.innerHTML = '<tr><td class="p-4 text-slate-400" colspan="5">Carrito vacio.</td></tr>';
        } else {
          cartBody.innerHTML = cart
            .map(
              (item) => `
                <tr class="group relative bg-white bg-[#1a242f] rounded-lg shadow-sm border border-transparent hover:border-slate-300 hover:border-slate-600 transition-colors">
                  <td class="p-3 rounded-l-lg">
                    <div class="flex flex-col">
                      <span class="text-sm font-medium text-slate-900 text-white leading-tight">${item.name}</span>
                      <span class="text-[10px] text-slate-400 mt-0.5">SKU: ${item.sku || "-"}</span>
                    </div>
                  </td>
                  <td class="p-2 align-middle">
                    <div class="flex items-center justify-center gap-2 bg-slate-100 bg-slate-800 rounded px-1 py-1">
                      <button data-action="dec" data-id="${item.id}" class="size-6 flex items-center justify-center rounded bg-white bg-slate-700 shadow-sm text-slate-600 text-slate-300 hover:text-primary active:scale-95 transition-all">
                        <span class="material-symbols-outlined text-[14px]">remove</span>
                      </button>
                      <span class="text-sm font-bold font-mono w-4 text-center">${item.qty}</span>
                      <button data-action="inc" data-id="${item.id}" class="size-6 flex items-center justify-center rounded bg-white bg-slate-700 shadow-sm text-slate-600 text-slate-300 hover:text-primary active:scale-95 transition-all">
                        <span class="material-symbols-outlined text-[14px]">add</span>
                      </button>
                    </div>
                  </td>
                  <td class="p-3 text-right text-sm text-slate-500 text-slate-400 font-mono align-middle">${formatMoney(item.price)}</td>
                  <td class="p-3 text-right text-sm font-bold text-slate-900 text-white font-mono align-middle">${formatMoney(item.price * item.qty)}</td>
                  <td class="p-2 rounded-r-lg align-middle text-center">
                    <button data-action="remove" data-id="${item.id}" class="text-slate-400 hover:text-red-500 transition-colors p-1 rounded-md hover:bg-slate-100 hover:bg-slate-800">
                      <span class="material-symbols-outlined text-[18px]">delete</span>
                    </button>
                  </td>
                </tr>
              `
            )
            .join("");
        }

        const subtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
        const tax = subtotal * 0.16;
        const total = subtotal + tax;
        subtotalEl.textContent = formatMoney(subtotal);
        taxEl.textContent = formatMoney(tax);
        totalEl.textContent = formatMoney(total);
      };

      const addToCart = (item) => {
        const existing = cart.find((entry) => entry.id === item.id);
        if (existing) {
          existing.qty = Math.min(existing.qty + 1, Number(item.stock || 0));
        } else {
          cart.push({
            id: item.id,
            sku: item.sku,
            name: item.name,
            price: Number(item.price || 0),
            qty: 1,
            stock: Number(item.stock || 0),
            category: item.category || null,
          });
        }
        renderCart();
      };
      document.getElementById("skuForm").addEventListener("submit", (event) => {
        event.preventDefault();
        const term = skuInput.value.trim();
        if (!term) return;
        const match = inventory.find((item) => item.sku?.toLowerCase() === term.toLowerCase());
        if (match) {
          addToCart(match);
          skuInput.value = "";
          setStatus("");
        } else {
          setStatus("SKU no encontrado.");
        }
      });

      nameInput.addEventListener("input", renderProducts);

      document.getElementById("categoryTabs").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-category]");
        if (!button) return;
        document.querySelectorAll("#categoryTabs button").forEach((btn) => {
          btn.classList.remove("bg-primary", "text-white", "shadow-primary/20");
          btn.classList.add("bg-white", " bg-surface-dark", "text-slate-600", " text-slate-400", "border", "border-slate-200", " border-slate-700");
        });
        button.classList.add("bg-primary", "text-white", "shadow-primary/20");
        button.classList.remove("bg-white", " bg-surface-dark", "text-slate-600", " text-slate-400", "border", "border-slate-200", " border-slate-700");
        activeCategory = button.dataset.category || "Todas";
        renderProducts();
      });

      productGrid.addEventListener("click", (event) => {
        const card = event.target.closest("button[data-id]");
        if (!card) return;
        const product = inventory.find((item) => item.id === card.dataset.id);
        if (product) addToCart(product);
      });

      cartBody.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-action]");
        if (!button) return;
        const id = button.dataset.id;
        if (button.dataset.action === "inc") {
          const item = cart.find((entry) => entry.id === id);
          if (item && (!item.stock || item.qty < item.stock)) {
            item.qty += 1;
          }
        }
        if (button.dataset.action === "dec") {
          const item = cart.find((entry) => entry.id === id);
          if (item) {
            item.qty -= 1;
            if (item.qty <= 0) {
              cart = cart.filter((entry) => entry.id !== id);
            }
          }
        }
        if (button.dataset.action === "remove") {
          cart = cart.filter((entry) => entry.id !== id);
        }
        renderCart();
      });

      document.getElementById("paymentCash").addEventListener("change", () => {
        paymentMethod = "cash";
      });
      document.getElementById("paymentCard").addEventListener("change", () => {
        paymentMethod = "card";
      });

      document.getElementById("btnCancel").addEventListener("click", () => {
        cart = [];
        renderCart();
        setStatus("Orden cancelada.");
      });

      document.getElementById("btnCustomer").addEventListener("click", () => {
        const name = prompt("Nombre del cliente:", customer.name);
        if (name) {
          customer.name = name;
          customer.type = "Cliente";
          customerName.textContent = customer.name;
          customerType.textContent = customer.type;
        }
      });

      const loginModal = document.getElementById("loginModal");
      const loginStatus = document.getElementById("loginStatus");
      const btnProfile = document.getElementById("btnProfile");

      btnProfile.addEventListener("click", () => {
        loginModal.classList.toggle("hidden");
      });

      document.getElementById("btnLogout").addEventListener("click", async () => {
        if (!currentUser) {
          loginModal.classList.add("hidden");
          return;
        }
        await signOut(auth);
        loginModal.classList.add("hidden");
      });

      document.getElementById("btnLogin").addEventListener("click", async () => {
        loginStatus.textContent = "";
        const email = normalizeLogin(document.getElementById("loginEmail").value);
        const password = document.getElementById("loginPassword").value;
        try {
          if (!email || !password) {
            loginStatus.textContent = "Completa usuario y contraseña.";
            return;
          }
          await signInWithEmailAndPassword(auth, email, password);
          loginStatus.textContent = "Ingreso correcto.";
          loginModal.classList.add("hidden");
        } catch (error) {
          loginStatus.textContent = error.message || "No se pudo iniciar sesión.";
        }
      });

      const verifyPosAccess = async (user) => {
        if (!user) return { allowed: false, role: "Pending", permissions: [] };
        const snap = await getDoc(doc(db, "users", user.uid));
        const data = snap.exists() ? snap.data() : {};
        const role = data.role || "Pending";
        const permissions = Array.isArray(data.permissions) ? data.permissions : [];
        const allowed = role === "Admin" || role === "StaffFerreteria" || permissions.includes("pos");
        return { allowed, role, permissions, data };
      };

      onAuthStateChanged(auth, async (user) => {
        currentUser = user;
        hasPosAccess = false;
        currentProfile = null;
        if (!user) {
          document.getElementById("profileLabel").textContent = "Perfil";
          loginModal.classList.remove("hidden");
          return;
        }
        const result = await verifyPosAccess(user);
        if (!result.allowed) {
          loginStatus.textContent = "Sin permisos para POS. Contacta al superadmin.";
          await signOut(auth);
          loginModal.classList.remove("hidden");
          return;
        }
        hasPosAccess = true;
        currentProfile = result.data || null;
        document.getElementById("profileLabel").textContent = currentProfile?.username || user?.email || "Perfil";
      });

      document.getElementById("btnFinalize").addEventListener("click", async () => {
        if (!currentUser || !hasPosAccess) {
          setStatus("Debes iniciar sesión.");
          loginModal.classList.remove("hidden");
          return;
        }
        if (cart.length === 0) {
          setStatus("Agrega productos al carrito.");
          return;
        }

        try {
          setStatus("Procesando venta...");
          const salesCol = collection(db, "sales");
          const saleRef = doc(salesCol);
          const ticketRef = doc(db, "tickets", saleRef.id);

          await runTransaction(db, async (transaction) => {
            let subtotal = 0;
            const items = [];

            for (const entry of cart) {
              const inventoryRef = doc(db, "inventory", entry.id);
              const inventorySnap = await transaction.get(inventoryRef);
              if (!inventorySnap.exists()) {
                throw new Error("Producto no encontrado.");
              }
              const data = inventorySnap.data();
              const stock = Number(data.stock || 0);
              if (stock < entry.qty) {
                throw new Error(`Stock insuficiente para ${data.name || entry.sku}.`);
              }
              const price = Number(entry.price || data.price || 0);
              subtotal += price * entry.qty;
              items.push({
                inventoryId: entry.id,
                sku: data.sku || entry.sku || null,
                name: data.name || entry.name || "Producto",
                category: data.category || entry.category || null,
                qty: entry.qty,
                price,
              });
              transaction.update(inventoryRef, {
                stock: stock - entry.qty,
                updatedAt: serverTimestamp(),
              });
            }

            const taxRate = 0.16;
            const tax = Number((subtotal * taxRate).toFixed(2));
            const total = Number((subtotal + tax).toFixed(2));

            const payload = {
              items,
              subtotal,
              taxRate,
              tax,
              total,
              paymentMethod,
              cashierId: currentUser.uid,
              customer,
              status: "pagado",
              createdAt: serverTimestamp(),
            };

            transaction.set(saleRef, payload);
            transaction.set(ticketRef, { ...payload, source: "sale" });
          });

          ticketInfo.textContent = `Ticket generado: ${saleRef.id}`;
          logAuditEvent({ action: 'create', resource: 'sale', resourceId: saleRef.id, severity: 'info', details: { total: payload.total, paymentMethod } });
          cart = [];
          renderCart();
          setStatus("Venta registrada correctamente.");
          window.open(`/consulta/${saleRef.id}`, "_blank", "noopener,noreferrer");
        } catch (error) {
          setStatus(error.message || "No se pudo finalizar la venta.");
        }
      });

      document.getElementById("btnDashboard").addEventListener("click", () => {
        window.location.href = "/dashboard-ferreteria";
      });

      const inventoryQuery = query(collection(db, "inventory"), orderBy("name"), limit(200));
      onSnapshot(inventoryQuery, (snapshot) => {
        inventory.length = 0;
        snapshot.forEach((docSnap) => inventory.push({ id: docSnap.id, ...docSnap.data() }));
        renderCategories();
        renderProducts();
        renderCart();
      });
    </script>
  <script type="module" src="/shared/footer.js"></script>
  <script type="module" src="/shared/i18n-es.js"></script>
</body>
</html>
