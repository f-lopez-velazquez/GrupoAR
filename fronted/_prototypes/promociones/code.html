<!DOCTYPE html>
<html lang="es" class="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grupo AR - Calendario de promociones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/tailwind.css" />
    <link rel="stylesheet" href="/assets/theme.css" />
  </head>
  <body class="bg-background-light text-slate-900 font-display min-h-screen flex flex-col">
    <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur">
      <div class="mx-auto flex w-full max-w-6xl items-center justify-between px-4 py-4">
        <a class="flex items-center gap-3" href="/dashboard-ejecutivo">
          <img src="/assets/logo.png" alt="Logo Grupo AR" class="h-9 w-9" />
          <div>
            <p class="text-sm font-semibold">Grupo AR</p>
            <p class="text-xs text-slate-500">Calendario de promociones</p>
          </div>
        </a>
        <nav class="hidden items-center gap-4 text-sm font-semibold text-slate-600 md:flex">
          <a class="hover:text-primary" href="/dashboard-ejecutivo">Panel</a>
          <a class="hover:text-primary" href="/roles-permisos">Módulos</a>
          <a class="hover:text-primary" href="/reportes">Reportes</a>
        </nav>
      </div>
    </header>

    <main class="flex-1 px-4 py-8">
      <div class="mx-auto w-full max-w-6xl">
        <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
          <div>
            <p class="text-xs uppercase tracking-[0.3em] text-slate-400">Promociones</p>
            <h1 class="text-3xl font-extrabold">Calendario y contenido</h1>
            <p class="mt-2 text-sm text-slate-500">
              Planea publicaciones, canales y texto sugerido para cada promocion.
            </p>
          </div>
          <div class="flex gap-2">
            <button id="addPromoBtn" class="rounded-full bg-primary px-4 py-2 text-xs font-bold text-white">Nueva promocion</button>
          </div>
        </div>

        <div class="mt-6 grid gap-4 md:grid-cols-3">
          <div class="md:col-span-2">
            <div class="flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2">
              <span class="material-symbols-outlined text-slate-400">search</span>
              <input id="searchInput" class="w-full text-sm outline-none" placeholder="Buscar por titulo o canal" />
            </div>
          </div>
          <div>
            <select id="statusFilter" class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm">
              <option value="Todos">Todos los estados</option>
              <option value="Programado">Programado</option>
              <option value="Publicado">Publicado</option>
              <option value="Pausado">Pausado</option>
            </select>
          </div>
        </div>

        <div class="mt-6 overflow-x-auto rounded-2xl border border-slate-200 bg-white shadow-sm">
          <table class="w-full text-left text-sm">
            <thead class="border-b border-slate-200 bg-slate-50 text-xs uppercase tracking-wider text-slate-400">
              <tr>
                <th class="px-4 py-3">Promocion</th>
                <th class="px-4 py-3">Fecha</th>
                <th class="px-4 py-3">Canal</th>
                <th class="px-4 py-3">Estado</th>
                <th class="px-4 py-3 text-right">Acciones</th>
              </tr>
            </thead>
            <tbody id="promoTable"></tbody>
          </table>
        </div>

        <div id="emptyState" class="hidden mt-6 rounded-xl border border-dashed border-slate-200 p-6 text-center text-sm text-slate-500">
          No hay promociones programadas.
        </div>
      </div>
    </main>

    <div id="promoModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4">
      <div class="w-full max-w-lg rounded-2xl bg-white p-6 shadow-2xl">
        <div class="flex items-center justify-between">
          <h2 id="modalTitle" class="text-lg font-bold">Nueva promocion</h2>
          <button id="closeModal" class="text-slate-400 hover:text-slate-600">X</button>
        </div>
        <form id="promoForm" class="mt-4 grid gap-3">
          <input type="hidden" id="promoId" />
          <label class="text-xs font-semibold text-slate-500">Titulo
            <input id="promoTitle" required class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" />
          </label>
          <div class="grid grid-cols-2 gap-3">
            <label class="text-xs font-semibold text-slate-500">Fecha de publicacion
              <input id="promoDate" type="date" required class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" />
            </label>
            <label class="text-xs font-semibold text-slate-500">Canal
              <input id="promoChannel" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" placeholder="Facebook, WhatsApp" />
            </label>
          </div>
          <label class="text-xs font-semibold text-slate-500">Estado
            <select id="promoStatus" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm">
              <option>Programado</option>
              <option>Publicado</option>
              <option>Pausado</option>
            </select>
          </label>
          <label class="text-xs font-semibold text-slate-500">Texto sugerido
            <textarea id="promoContent" rows="4" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm"></textarea>
          </label>
          <label class="text-xs font-semibold text-slate-500">Indicaciones
            <textarea id="promoNotes" rows="2" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm"></textarea>
          </label>
          <div class="mt-2 flex justify-end gap-2">
            <button type="button" id="cancelModal" class="rounded-lg border border-slate-200 px-4 py-2 text-sm">Cancelar</button>
            <button type="submit" class="rounded-lg bg-primary px-4 py-2 text-sm font-bold text-white">Guardar</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module">
      import { ensureAuth } from "/shared/auth.js";
      import { db } from "/shared/firebase.js";
      import {
        addDoc,
        collection,
        deleteDoc,
        doc,
        onSnapshot,
        orderBy,
        query,
        serverTimestamp,
        updateDoc,
      } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

      const promoTable = document.getElementById("promoTable");
      const emptyState = document.getElementById("emptyState");
      const searchInput = document.getElementById("searchInput");
      const statusFilter = document.getElementById("statusFilter");

      const modal = document.getElementById("promoModal");
      const modalTitle = document.getElementById("modalTitle");
      const promoForm = document.getElementById("promoForm");
      const promoId = document.getElementById("promoId");
      const promoTitle = document.getElementById("promoTitle");
      const promoDate = document.getElementById("promoDate");
      const promoChannel = document.getElementById("promoChannel");
      const promoStatus = document.getElementById("promoStatus");
      const promoContent = document.getElementById("promoContent");
      const promoNotes = document.getElementById("promoNotes");

      const addPromoBtn = document.getElementById("addPromoBtn");
      const closeModal = document.getElementById("closeModal");
      const cancelModal = document.getElementById("cancelModal");

      let promotions = [];

      const openModal = (promo = null) => {
        modal.classList.remove("hidden");
        modal.classList.add("flex");
        if (promo) {
          modalTitle.textContent = "Editar promocion";
          promoId.value = promo.id;
          promoTitle.value = promo.title || "";
          promoDate.value = promo.publishDate || "";
          promoChannel.value = promo.channel || "";
          promoStatus.value = promo.status || "Programado";
          promoContent.value = promo.content || "";
          promoNotes.value = promo.notes || "";
        } else {
          modalTitle.textContent = "Nueva promocion";
          promoForm.reset();
          promoId.value = "";
        }
      };

      const closeModalFn = () => {
        modal.classList.add("hidden");
        modal.classList.remove("flex");
      };

      const renderPromos = () => {
        const term = searchInput.value.trim().toLowerCase();
        const status = statusFilter.value;
        const filtered = promotions.filter((promo) => {
          const matchesTerm = !term || [promo.title, promo.channel].filter(Boolean).some((value) => value.toLowerCase().includes(term));
          const matchesStatus = status === "Todos" || promo.status === status;
          return matchesTerm && matchesStatus;
        });

        promoTable.innerHTML = "";
        if (!filtered.length) {
          emptyState.classList.remove("hidden");
          return;
        }
        emptyState.classList.add("hidden");

        filtered.forEach((promo) => {
          promoTable.insertAdjacentHTML(
            "beforeend",
            `
            <tr class="border-b border-slate-100 last:border-none">
              <td class="px-4 py-3">
                <p class="font-semibold">${promo.title || "Promocion"}</p>
                <p class="text-xs text-slate-500">${promo.content || "Sin contenido"}</p>
              </td>
              <td class="px-4 py-3 text-xs text-slate-600">${promo.publishDate || "-"}</td>
              <td class="px-4 py-3 text-xs text-slate-600">${promo.channel || "-"}</td>
              <td class="px-4 py-3">
                <span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-600">${promo.status || "Programado"}</span>
              </td>
              <td class="px-4 py-3 text-right">
                <div class="flex justify-end gap-2">
                  <button data-action="edit" data-id="${promo.id}" class="text-xs font-semibold text-primary">Editar</button>
                  <button data-action="delete" data-id="${promo.id}" class="text-xs font-semibold text-rose-500">Eliminar</button>
                </div>
              </td>
            </tr>
          `
          );
        });
      };

      addPromoBtn.addEventListener("click", () => openModal());
      closeModal.addEventListener("click", closeModalFn);
      cancelModal.addEventListener("click", closeModalFn);

      searchInput.addEventListener("input", renderPromos);
      statusFilter.addEventListener("change", renderPromos);

      promoTable.addEventListener("click", async (event) => {
        const button = event.target.closest("button[data-action]");
        if (!button) return;
        const id = button.dataset.id;
        const promo = promotions.find((entry) => entry.id === id);
        if (button.dataset.action === "edit") {
          openModal(promo);
          return;
        }
        if (button.dataset.action === "delete") {
          if (!confirm("Eliminar promocion?")) return;
          await deleteDoc(doc(db, "promotions", id));
        }
      });

      promoForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const payload = {
          title: promoTitle.value.trim(),
          publishDate: promoDate.value,
          channel: promoChannel.value.trim(),
          status: promoStatus.value,
          content: promoContent.value.trim(),
          notes: promoNotes.value.trim(),
          updatedAt: serverTimestamp(),
        };
        const id = promoId.value;
        if (id) {
          await updateDoc(doc(db, "promotions", id), payload);
        } else {
          await addDoc(collection(db, "promotions"), { ...payload, createdAt: serverTimestamp() });
        }
        closeModalFn();
      });

      ensureAuth({ allowRoles: ["Admin", "StaffFerreteria"], allowPermissions: ["promotions"] }).then(() => {
        const q = query(collection(db, "promotions"), orderBy("publishDate", "asc"));
        onSnapshot(q, (snapshot) => {
          promotions = snapshot.docs.map((docSnap) => ({ id: docSnap.id, ...docSnap.data() }));
          renderPromos();
        });
      });
    </script>
    <script type="module" src="/shared/footer.js"></script>
    <script type="module" src="/shared/i18n-es.js"></script>
  </body>
</html>
